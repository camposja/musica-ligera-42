# Supply-chain hardening. Requires pnpm >= 11. See team plan "adaptive-conjuring-nebula".
# Use `pnpm install`, NOT `npm install`.
minimumReleaseAge: 1440        # don't install versions published <24h ago
minimumReleaseAgeStrict: true  # fail rather than silently fall back to an older version
blockExoticSubdeps: true       # transitive deps must come from the registry, not git/tarball/url
strictDepBuilds: true          # FAIL install on any unreviewed build/postinstall script
dangerouslyAllowAllBuilds: false
allowBuilds:
  # Reviewed packages that genuinely need an install/build script — migrated from the
  # pre-v11 package.json#pnpm.onlyBuiltDependencies + pnpm-workspace onlyBuiltDependencies/
  # ignoredBuiltDependencies. Confirmed empirically against pnpm 11.1.3 (see plan).
  better-sqlite3: true         # native node-gyp build (SQLite driver)
  prisma: true                 # Prisma CLI / engine binaries
  "@prisma/client": true       # Prisma client generation
  "@prisma/engines": true      # Prisma engine binaries
  sharp: false                 # intentionally NOT built (was ignoredBuiltDependencies)
  unrs-resolver: false         # intentionally NOT built (was ignoredBuiltDependencies)
